<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Executivo TJSP: Orçamento, Salários e Efetivo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #8da9c4;
            --accent-red: #d9534f;
            --accent-green: #00a884;
            --accent-purple: #8e44ad;
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-dark: #333;
            --text-muted: #7f8c8d;
            --border-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }

        .dashboard {
            width: 100%;
            max-width: 1150px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Área de Controle e Abas */
        .controls-wrapper {
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container img { height: 45px; }

        /* Chave Mestra Global */
        .global-toggle {
            display: flex;
            background-color: #e2e8f0;
            border-radius: 30px;
            padding: 4px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .toggle-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .main-menu {
            display: flex;
            background-color: #eef2f5;
            border-bottom: 2px solid var(--border-color);
            padding-top: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background-color: var(--bg-card);
            border-radius: 8px 8px 0 0;
        }

        .sub-menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px;
            background-color: var(--bg-card);
        }

        .sub-btn {
            background-color: var(--border-color);
            color: #555;
            border: 2px solid transparent;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-btn:hover { background-color: #cbd4db; }
        .sub-btn.active { box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .sub-btn.active[data-color="nominal"] { background-color: var(--secondary); color: white; border-color: #5a7d9a; }
        .sub-btn.active[data-color="real"] { background-color: var(--accent-red); color: white; border-color: #b52b27; }
        .sub-btn.active[data-color="ranking"] { background-color: var(--primary); color: white; border-color: #1a252f; }
        .sub-btn.active[data-color="saldo"] { background-color: var(--accent-purple); color: white; border-color: #732d91; }
        .sub-btn.active[data-color="servidores"] { background-color: var(--accent-green); color: white; border-color: #007a60; }
        .sub-btn.active[data-color="bonus"] { background-color: #e67e22; color: white; border-color: #d35400; }

        /* Estilos da Home / Tabelas */
        .home-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .panel-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }

        .panel-title {
            margin: 0 0 15px 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th, .data-table td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }
        .data-table th:first-child, .data-table td:first-child { text-align: center; font-weight: bold; }
        .data-table th { background-color: #f8fafc; color: var(--primary); font-weight: 700; }
        .data-table tr:hover { background-color: #f1f5f9; }
        
        .val-positive { color: var(--accent-green); font-weight: bold; }
        .val-negative { color: var(--accent-red); font-weight: bold; }
        
        .select-year {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            color: var(--primary);
        }

        .total-budget {
            margin-top: 15px;
            padding: 12px;
            background-color: #f8fafc;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid var(--border-color);
        }

        /* Contêineres de Gráficos */
        .chart-box {
            background-color: var(--bg-card);
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
        }
        .chart-box.large { height: 65vh; }
        .chart-title { margin: 0 0 15px 0; font-size: 20px; font-weight: 700; text-align: center; transition: color 0.3s ease; }
        .canvas-container { position: relative; width: 100%; height: 40vh; min-height: 300px; }
        .large .canvas-container { height: 100%; }

        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .home-container { grid-template-columns: 1fr; }
            .header-top { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- HEADER E CONTROLES GLOBAIS -->
        <div class="controls-wrapper">

        <!-- ABA 0: SUMÁRIO EXECUTIVO (HOME) -->

        </div>

        // --- 1. CONFIGURAÇÕES E ESTADO GLOBAL ---
        let currentMode = 'loa'; // Pode ser 'loa' ou 'exec'

        // Fatores de Correção do INPC exatos para Jan/2026 (IBGE via BCB)

        // --- 4. FUNÇÕES DA HOME ---
        function renderHomeTables() {
            const tbody = document.getElementById('comparativeTableBody');
            tbody.innerHTML = '';
            
            // Inverte a ordem do array para exibir do mais recente (2026) para o mais antigo (2015)
            [...tjData].reverse().forEach(d => {
                const diff = (d.execTable - d.loa).toFixed(2);
                const isPositive = diff >= 0;
                const diffClass = isPositive ? 'val-positive' : 'val-negative';
                const sign = isPositive ? '+' : '';
                
                let execDisplay = d.execTable.toFixed(2).replace('.', ',');
                if(d.ano === '2026') execDisplay += ' <span style="font-size: 11px; color: #7f8c8d;">*(Até Jun)</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${d.ano}</td>
                    <td>${d.loa.toFixed(2).replace('.', ',')}</td>
                    <td>${execDisplay}</td>
                    <td class="${diffClass}">${sign}${diff.replace('.', ',')}</td>
                `;
                tbody.appendChild(tr);
            });

            renderRankingTable();
        }

        function renderRankingTable() {
            const year = document.getElementById('yearSelector').value;
            const data = rankingEstado[year];
            const tbody = document.getElementById('rankingTableBody');
            tbody.innerHTML = '';

            data.orgaos.forEach((org, index) => {
                const perc = ((org.val / data.total) * 100).toFixed(1);
                const style = org.isTj ? 'background-color: #ffeaa7; font-weight: bold;' : '';
                const star = org.isTj ? '⭐ ' : '';
                
                const tr = document.createElement('tr');
                tr.style = style;
                tr.innerHTML = `
                    <td>${index + 1}º</td>
                    <td style="text-align: left;">${star}${org.nome}</td>
                    <td>${org.val.toFixed(2).replace('.', ',')}</td>
                    <td>${perc}%</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('rankingTotal').innerHTML = `Orçamento Total do Estado em ${year}: <span style="color: var(--primary);">R$ ${data.total.toFixed(2).replace('.', ',')} Bilhões</span> <br><span style="font-size: 13px; font-weight: 500; color: #555;">(Total de ${data.orgsCount} órgãos orçamentários)</span>`;
        }

        // --- 5. LÓGICA GRÁFICA (A CHAVE MESTRA) ---
        window.setGlobalMode = function(mode) {
            currentMode = mode;
            
            document.getElementById('btnModeLoa').classList.remove('active');
            document.getElementById('btnModeExec').classList.remove('active');
            if (mode === 'loa') document.getElementById('btnModeLoa').classList.add('active');
            if (mode === 'exec') document.getElementById('btnModeExec').classList.add('active');

            const targetRealKey = mode === 'loa' ? 'real_loa' : 'real_exec';
            
            const dataRankOrc = [...baseData].sort((a, b) => b[targetRealKey] - a[targetRealKey]);
            const dataRankSaldo = [...baseData].sort((a, b) => {
                if (b.saldo !== a.saldo) return b.saldo - a.saldo;
                return b.inf - a.inf;
            });

            mapRankOrc = {}; dataRankOrc.forEach((d, i) => mapRankOrc[d.ano] = (i+1)+'ª');
            mapRankSaldo = {}; dataRankSaldo.forEach((d, i) => mapRankSaldo[d.ano] = (i+1)+'ª');

            if (currentAction) {
                document.querySelector(`[data-action="${currentAction}"]`).click();
            }
        };

        let chartTopInstance = null;
        let chartBottomInstance = null;
        const ctxTop = document.getElementById('topCanvas').getContext('2d');
        const ctxBottom = document.getElementById('bottomCanvas').getContext('2d');

        function createBudgetConfig(dataset, typeBase, mode = '') {
            const dataKey = `${typeBase}_${currentMode}`; 

            const labels = dataset.map(d => {
                let lbl = [...d.labelBase];
                if (mode.includes('rank')) lbl.push(mapRankOrc[d.ano]);
                return lbl;
            });
            const dataVals = dataset.map(d => d[dataKey]);
            
            const bgColor = dataset.map((d, i) => {
                if (mode === 'rank_orc') {
                    if (i === 0) return '#2ca02c'; 
                    if (i === dataset.length - 1) return '#d9534f'; 
                    return '#4a81ba'; 
                }
                if (mode === 'rank_saldo') {
                    return '#9b59b6'; 
                }
                return typeBase === 'nominal' ? '#8da9c4' : '#d9534f'; 
            });

            const tooltipTitleCb = (ctx) => {
                let title = Array.isArray(ctx[0].label) ? ctx[0].label[0] : ctx[0].label;
                if(currentMode === 'exec' && title === '2026') return title + " (Projeção via LOA)";
                return title;
            };

            return {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: dataVals, backgroundColor: bgColor, borderRadius: 4 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)', padding: 12, titleFont: {size: 14}, bodyFont: {size: 16, weight: 'bold'},
                            callbacks: {
                                title: tooltipTitleCb,
                                label: (ctx) => ' R$ ' + ctx.parsed.y.toFixed(2).replace('.', ',') + ' Bilhões'
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, min: 0, suggestedMax: 24, title: {display: true, text: 'Bilhões (R$)', font: {weight: 'bold'}}, ticks: {callback: v => 'R$ ' + v} },
                        x: { ticks: { font: {weight: 'bold'}, color: ctx => ctx.tick.label && ctx.tick.label.includes('GREVE') ? ['#333', '#d9534f'] : '#333' } }
                    },
                    animation: { duration: 800, easing: 'easeOutQuart' }
                }
            };
        }

        function createSalarialConfig(dataset, mode = '') {
            const labels = dataset.map(d => {
                let lbl = [...d.labelBase];
                if (mode.includes('rank')) lbl.push(mapRankSaldo[d.ano]);
                return lbl;
            });
            return {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Inflação', data: dataset.map(d=>d.inf), backgroundColor: 'rgba(243, 156, 18, 0.2)', borderColor: '#e67e22', borderWidth: 2, grouped: false, categoryPercentage: 0.8, barPercentage: 0.9, borderRadius: 3 },
                        { label: 'Reposição', data: dataset.map(d=>d.rep), backgroundColor: 'rgba(41, 128, 255, 1)', borderColor: '#2471a3', borderWidth: 1, grouped: false, categoryPercentage: 0.8, barPercentage: 0.45, borderRadius: 3 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            backgroundColor: 'rgba(255,255,255,0.95)', titleColor: '#333', bodyColor: '#333', borderColor: '#ccc', borderWidth: 1, padding: 12, titleFont: {size: 14}, bodyFont: {size: 14, weight: 'bold'},
                            callbacks: {
                                title: (ctx) => Array.isArray(ctx[0].label) ? ctx[0].label[0] : ctx[0].label,
                                label: (ctx) => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2) + '%',
                                afterBody: (ctx) => {
                                    let inf=0, rep=0;
                                    ctx.forEach(i => { if(i.datasetIndex === 0) inf = i.parsed.y; else rep = i.parsed.y; });
                                    let saldo = (rep - inf).toFixed(2);
                                    return '\nSaldo: ' + (saldo > 0 ? '+' : '') + saldo + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, min: 0, suggestedMax: 12, title: {display: true, text: 'Índice (%)', font: {weight: 'bold'}}, ticks: {callback: v => v + '%'} },
                        x: { ticks: { font: {weight: 'bold'}, color: ctx => ctx.tick.label && ctx.tick.label.includes('GREVE') ? ['#333', '#d9534f'] : '#333' } }
                    }
                }
            };
        }

        function createServidoresConfig(dataset) {
            return {
                type: 'line',
                data: {
                    labels: dataset.map(d => d.labelBase),
                    datasets: [{ label: 'Nº de Servidores Ativos', data: dataset.map(d=>d.serv), borderColor: '#00a884', backgroundColor: 'rgba(0, 168, 132, 0.15)', borderWidth: 3, fill: true, tension: 0.35, pointRadius: 5, pointHoverRadius: 8, pointBackgroundColor: '#00a884' }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(0, 168, 132, 0.95)', titleColor: '#fff', bodyColor: '#fff', padding: 12, titleFont: {size: 14}, bodyFont: {size: 15, weight: 'bold'}, callbacks: { label: (ctx) => ' Servidores Ativos: ' + ctx.parsed.y.toLocaleString('pt-BR') } }
                    },
                    scales: {
                        y: { beginAtZero: false, min: 35000, max: 44000, ticks: { stepSize: 1000, callback: v => v.toLocaleString('pt-BR') }, title: {display: true, text: 'Nº de Servidores', font: {weight: 'bold'}} },
                        x: { ticks: { font: {weight: 'bold'}, color: ctx => ctx.tick.label && ctx.tick.label.includes('GREVE') ? ['#333', '#d9534f'] : '#333' } }
                    }
                }
            };
        }

        function createBubbleConfig(dataset) {
            const dataKey = `real_${currentMode}`; 
            
            const bubbleData = dataset.map(d => {
                const r = Math.abs(d.saldo) * 4 + 4; 
                return { x: d[dataKey], y: d.serv, r: r, ano: d.ano, saldo: d.saldo };
            });

            const bgColors = bubbleData.map(d => d.saldo > 0 ? 'rgba(46, 204, 113, 0.7)' : (d.saldo === 0 ? 'rgba(149, 165, 166, 0.7)' : 'rgba(231, 76, 60, 0.7)'));
            const borderColors = bubbleData.map(d => d.saldo > 0 ? '#27ae60' : (d.saldo === 0 ? '#7f8c8d' : '#c0392b'));

            return {
                type: 'bubble',
                data: { datasets: [{ label: 'Raio-X Anual', data: bubbleData, backgroundColor: bgColors, borderColor: borderColors, borderWidth: 2, hoverRadius: 5 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(44, 62, 80, 0.95)', titleColor: '#fff', bodyColor: '#fff', padding: 15, titleFont: {size: 16}, bodyFont: {size: 14},
                            callbacks: {
                                title: (ctx) => {
                                    let title = 'Ano Referência: ' + ctx[0].raw.ano;
                                    if(currentMode === 'exec' && ctx[0].raw.ano === '2026') return title + " (Projeção)";
                                    return title;
                                },
                                label: (ctx) => {
                                    const d = ctx.raw;
                                    return [
                                        `Orçamento Real: R$ ${d.x.toFixed(2).replace('.',',')} Bi`,
                                        `Servidores Ativos: ${d.y.toLocaleString('pt-BR')}`,
                                        `Saldo Salarial: ${d.saldo > 0 ? '+' : ''}${d.saldo}%`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: '➔ Orçamento Real Corrigido (R$ Bilhões)', font: {weight: 'bold', size: 14} }, min: 16, max: 24, ticks: { callback: v => 'R$ ' + v + ' Bi' } },
                        y: { title: { display: true, text: '➔ Quadro de Servidores Ativos (Nº)', font: {weight: 'bold', size: 14} }, min: 37000, max: 44000, ticks: { stepSize: 1000, callback: v => v.toLocaleString('pt-BR') } }
                    },
                    animation: { duration: 1200, easing: 'easeOutBounce' }
                }
            };
        }

        function renderCharts(topConfig, topTitle, topColor, bottomConfig = null, bottomTitle = null, bottomColor = null, isSingleLarge = false) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('topChartBox').classList.remove('hidden');

            const lblMode = currentMode === 'loa' ? '(Dotação LOA)' : '(Despesa Executada)';
            const tTitle = `${topTitle} ${lblMode}`;

            const topBox = document.getElementById('topChartBox');
            if (isSingleLarge) topBox.classList.add('large'); else topBox.classList.remove('large');

            const topTitleEl = document.getElementById('topChartTitle');
            topTitleEl.textContent = tTitle;
            topTitleEl.style.color = `var(--${topColor})`;
            
            if (chartTopInstance) {
                chartTopInstance.config.type = topConfig.type;
                chartTopInstance.data = topConfig.data;
                chartTopInstance.options = topConfig.options;
                chartTopInstance.update();
            } else {
                chartTopInstance = new Chart(ctxTop, topConfig);
            }

            const bottomBox = document.getElementById('bottomChartBox');
            if (bottomConfig) {
                bottomBox.classList.remove('hidden');
                document.getElementById('bottomChartTitle').textContent = bottomTitle;
                document.getElementById('bottomChartTitle').style.color = `var(--${bottomColor})`;
                
                if (chartBottomInstance) {
                    chartBottomInstance.config.type = bottomConfig.type;
                    chartBottomInstance.data = bottomConfig.data;
                    chartBottomInstance.options = bottomConfig.options;
                    chartBottomInstance.update();
                } else {
                    chartBottomInstance = new Chart(ctxBottom, bottomConfig);
                }
            } else {
                bottomBox.classList.add('hidden');
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const targetTab = e.target.getAttribute('data-tab');
                document.querySelectorAll('.sub-menu').forEach(sm => sm.classList.add('hidden'));
                
                if (targetTab === 'menu0') {
                    currentAction = null;
                    document.getElementById('homeView').classList.remove('hidden');
                    document.getElementById('topChartBox').classList.add('hidden');
                    document.getElementById('bottomChartBox').classList.add('hidden');
                } else {
                    if (targetTab === 'menu1') {
                        document.getElementById('subMenu1').classList.remove('hidden');
                        document.querySelector('[data-action="m1_nominal"]').click(); 
                    } else if (targetTab === 'menu2') {
                        document.getElementById('subMenu2').classList.remove('hidden');
                        document.querySelector('[data-action="m2_crono"]').click();
                    } else if (targetTab === 'menu3') {
                        document.getElementById('subMenu3').classList.remove('hidden');
                        document.querySelector('[data-action="m3_orc"]').click();
                    } else if (targetTab === 'menu4') {
                        document.getElementById('subMenu4').classList.remove('hidden');
                        document.querySelector('[data-action="m4_bubble"]').click();
                    }
                }
            });
        });

        document.querySelectorAll('.sub-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.target.parentElement.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const action = e.target.getAttribute('data-action');
                currentAction = action; 

                const targetRealKey = currentMode === 'loa' ? 'real_loa' : 'real_exec';
                const dataRankOrc = [...baseData].sort((a, b) => b[targetRealKey] - a[targetRealKey]);
                const dataRankSaldo = [...baseData].sort((a, b) => {
                    if (b.saldo !== a.saldo) return b.saldo - a.saldo;
                    return b.inf - a.inf;
                });

                switch(action) {
                    case 'm1_nominal':
                        renderCharts(createBudgetConfig(dataCrono, 'nominal', 'crono'), 'Orçamento TJSP: Nominais', 'primary');
                        break;
                    case 'm1_real':
                        renderCharts(createBudgetConfig(dataCrono, 'real', 'crono'), 'Orçamento TJSP: Reais Corrigidos', 'accent-red');
                        break;
                    case 'm2_crono':
                        renderCharts(
                            createBudgetConfig(dataCrono, 'real', 'crono'), 'Orçamento Real: Cronológica', 'accent-red',
                            createSalarialConfig(dataCrono, 'crono'), 'Política Salarial: Inflação vs Reposição', 'primary'
                        );
                        break;
                    case 'm2_rank_orc':
                        renderCharts(
                            createBudgetConfig(dataRankOrc, 'real', 'rank_orc'), 'Ranking: Orçamento Real (Maior ao Menor)', 'primary',
                            createSalarialConfig(dataRankOrc, 'rank_orc'), 'Política Salarial Acompanhando o Orçamento', 'text-dark'
                        );
                        break;
                    case 'm2_rank_saldo':
                        renderCharts(
                            createSalarialConfig(dataRankSaldo, 'rank_saldo'), 'Ranking: Saldo Salarial (Maior Ganho ao Arrocho)', 'accent-purple',
                            createBudgetConfig(dataRankSaldo, 'real', 'rank_saldo'), 'Orçamento Real Acompanhando o Saldo Salarial', 'text-dark'
                        );
                        break;
                    case 'm3_orc':
                        renderCharts(
                            createBudgetConfig(dataCrono, 'real', 'crono'), 'Orçamento Real (Ordem Cronológica)', 'accent-red',
                            createServidoresConfig(dataCrono), 'Evolução do Efetivo TJSP', 'accent-green'
                        );
                        break;
                    case 'm3_saldo':
                        renderCharts(
                            createSalarialConfig(dataCrono, 'crono'), 'Política Salarial (Ordem Cronológica)', 'primary',
                            createServidoresConfig(dataCrono), 'Evolução do Efetivo TJSP', 'accent-green'
                        );
                        break;
                    case 'm4_bubble':
                        renderCharts(
                            createBubbleConfig(dataCrono), 'Raio-X 3D: Orçamento vs Servidores vs Salário', 'text-dark',
                            null, null, null, true
                        );
                        break;
                }
            });
        });

        setGlobalMode('loa'); 
        renderHomeTables();

    </script>
</body>
</html>
