<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo: Orçamento vs Política Salarial TJSP</title>
    
    <!-- Importando a biblioteca Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .dashboard {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .chart-container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            position: relative;
        }

        .header-controls {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0 0 20px 0;
            color: #2c3e50;
            font-size: 22px;
            transition: color 0.3s ease;
        }
        
        h3 {
            margin: 0 0 15px 0;
            color: #34495e;
            font-size: 18px;
            text-align: center;
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            background-color: #e0e6ed;
            color: #555;
            border: 2px solid transparent;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #cbd4db;
        }

        /* Cores ativas para cada botão */
        button.active-nominal {
            background-color: #8da9c4;
            color: white;
            border-color: #5a7d9a;
            box-shadow: 0 4px 10px rgba(141, 169, 196, 0.4);
        }

        button.active-real {
            background-color: #d9534f;
            color: white;
            border-color: #b52b27;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.4);
        }

        button.active-ranking {
            background-color: #2c3e50;
            color: white;
            border-color: #1a252f;
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.4);
        }
        
        /* Nova cor para o botão de Saldo */
        button.active-saldo {
            background-color: #8e44ad;
            color: white;
            border-color: #732d91;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.4);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Gráfico Superior (Orçamento) -->
        <div class="chart-container">

            <!-- LOGO DO COLETIVO NO CANTO DO QUADRO -->
            <img src="logo.png" alt="Logo do Coletivo" style="position: absolute; top: 15px; left: 20px; height: 65px; z-index: 10;">

            <div class="header-controls">
                <h2 id="chartTitle">Orçamento TJSP: Valores Nominais</h2>
                <div class="button-group">
                    <button id="btnNominal" class="active-nominal">1. Nominal</button>
                    <button id="btnReal">2. C. Monetária</button>
                    <button id="btnRanking">3. Ranking Orçamento)</button>
                    <button id="btnSaldo">4. Ranking Reposição</button>
                </div>
            </div>
            <canvas id="orcamentoChart" height="100"></canvas>
        </div>

        <!-- Gráfico Inferior (Inflação x Reposição) -->
        <div class="chart-container">

            <!-- LOGO DO COLETIVO NO CANTO DO QUADRO -->
            <img src="logo.png" alt="Logo do Coletivo" style="position: absolute; top: 15px; left: 20px; height: 65px; z-index: 10;">

            <h3>Política Salarial: Inflação vs Reposição (Acompanhando o eixo superior)</h3>
            <canvas id="salarialChart" height="80"></canvas>
        </div>
    </div>

    <script>
        // 1. Dados Base Conjuntos (2015 a 2026)
        const anosCronologicos = ['2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'];
        
        // Criando a matriz com a palavra GREVE acoplada
        const labelsSalarialCronologico = anosCronologicos.map(ano => ano === '2025' ? ['2025', 'GREVE'] : ano);
        
        // Dados do Orçamento
        const valoresNominais = [10.01, 10.97, 11.42, 11.65, 12.23, 12.53, 12.54, 13.18, 15.25, 15.44, 17.23, 19.30];
        const valoresReais = [17.63, 17.34, 17.25, 17.35, 17.49, 17.29, 16.31, 15.56, 17.08, 16.68, 17.81, 19.30];
        
        // Dados Salariais
        const inflacaoCronologica = [7.68, 11.08, 4.69, 1.81, 3.94, 3.92, 6.22, 10.80, 5.47, 3.86, 4.87, 3.36];
        const reposicaoCronologica = [7.68, 7.08, 5.20, 1.81, 3.94, 0.00, 0.00, 10.00, 6.00, 4.00, 7.63, 4.25];

        // 2. Preparando os dados espelhados para o Ranking de Orçamento Real
        let dadosParaOrdenar = anosCronologicos.map((ano, index) => {
            return { 
                ano: ano, 
                valorReal: valoresReais[index],
                inflacao: inflacaoCronologica[index],
                reposicao: reposicaoCronologica[index]
            };
        });
        
        // Ordena do MAIOR para o MENOR orçamento real (Decrescente)
        dadosParaOrdenar.sort((a, b) => b.valorReal - a.valorReal);
        
        const anosRanking = dadosParaOrdenar.map(item => item.ano);
        const labelsSalarialRanking = anosRanking.map(ano => ano === '2025' ? ['2025', 'GREVE'] : ano);
        const valoresRanking = dadosParaOrdenar.map(item => item.valorReal);
        const inflacaoRanking = dadosParaOrdenar.map(item => item.inflacao);
        const reposicaoRanking = dadosParaOrdenar.map(item => item.reposicao);

        // Cores do Ranking de Orçamento
        const coresRanking = valoresRanking.map((valor, index) => {
            if (index === 0) return '#2ca02c'; 
            if (index === valoresRanking.length - 1) return '#d9534f'; 
            return '#4a81ba'; 
        });

        // 2.5 Preparando os dados espelhados para o Ranking de SALDO SALARIAL
        let dadosParaOrdenarSaldo = anosCronologicos.map((ano, index) => {
            return { 
                ano: ano, 
                valorReal: valoresReais[index], 
                inflacao: inflacaoCronologica[index],
                reposicao: reposicaoCronologica[index],
                saldo: reposicaoCronologica[index] - inflacaoCronologica[index] 
            };
        });

        // Ordena com CRITÉRIO DE DESEMPATE
        dadosParaOrdenarSaldo.sort((a, b) => {
            if (b.saldo !== a.saldo) {
                return b.saldo - a.saldo; // Prioridade 1: Maior Saldo
            } else {
                return b.inflacao - a.inflacao; // Prioridade 2 (Desempate): Maior Inflação Bruta
            }
        });

        const anosSaldo = dadosParaOrdenarSaldo.map(item => item.ano);
        const labelsSalarialSaldo = anosSaldo.map(ano => ano === '2025' ? ['2025', 'GREVE'] : ano);
        const valoresReaisSaldo = dadosParaOrdenarSaldo.map(item => item.valorReal);
        const inflacaoSaldo = dadosParaOrdenarSaldo.map(item => item.inflacao);
        const reposicaoSaldo = dadosParaOrdenarSaldo.map(item => item.reposicao);

        // 3. Inicializando Gráfico Superior (Orçamento)
        const ctxOrcamento = document.getElementById('orcamentoChart').getContext('2d');
        let orcamentoChart = new Chart(ctxOrcamento, {
            type: 'bar',
            data: {
                labels: [...anosCronologicos],
                datasets: [{
                    label: 'Orçamento Nominal (R$ Bilhões)',
                    data: valoresNominais,
                    backgroundColor: '#8da9c4',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: { size: 14 },
                        bodyFont: { size: 16, weight: 'bold' },
                        callbacks: {
                            label: function(context) { return ' R$ ' + context.parsed.y.toFixed(2).replace('.', ',') + ' Bilhões'; }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 21,
                        title: { display: true, text: 'Bilhões (R$)', font: { weight: 'bold' } },
                        ticks: { callback: function(value) { return 'R$ ' + value; } }
                    },
                    x: {
                        ticks: { font: { weight: 'bold' } }
                    }
                },
                animation: { duration: 1000, easing: 'easeOutQuart' }
            }
        });

        // 4. Inicializando Gráfico Inferior (Inflação x Reposição)
        const ctxSalarial = document.getElementById('salarialChart').getContext('2d');
        let salarialChart = new Chart(ctxSalarial, {
            type: 'bar',
            data: {
                labels: [...labelsSalarialCronologico], 
                datasets: [
                    {
                        label: 'Inflação', 
                        data: inflacaoCronologica,
                        backgroundColor: 'rgba(243, 156, 18, 0.2)', 
                        borderColor: '#e67e22',
                        borderWidth: 2,
                        grouped: false, 
                        categoryPercentage: 0.8,
                        barPercentage: 0.9, 
                        borderRadius: 3
                    },
                    {
                        label: 'Reposição', 
                        data: reposicaoCronologica,
                        backgroundColor: 'rgba(41, 128, 255, 1)', 
                        borderColor: '#2471a3',
                        borderWidth: 1,
                        grouped: false, 
                        categoryPercentage: 0.8,
                        barPercentage: 0.45, 
                        borderRadius: 3
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: { display: true, position: 'top' },
                    tooltip: {
                        backgroundColor: 'rgba(255, 255, 255, 0.95)',
                        titleColor: '#333',
                        bodyColor: '#333',
                        borderColor: '#ccc',
                        borderWidth: 1,
                        padding: 12,
                        titleFont: { size: 14 },
                        bodyFont: { size: 14, weight: 'bold' },
                        callbacks: {
                            title: function(context) { 
                                let title = context[0].label;
                                if (Array.isArray(title)) return title[0];
                                if (typeof title === 'string' && title.includes(',')) return title.split(',')[0];
                                return title;
                            },
                            label: function(context) { return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + '%'; },
                            afterBody: function(context) {
                                let inflacao = 0;
                                let reposicao = 0;
                                context.forEach(item => {
                                    if (item.dataset.label === 'Inflação') inflacao = item.parsed.y;
                                    if (item.dataset.label === 'Reposição') reposicao = item.parsed.y;
                                });
                                let saldo = (reposicao - inflacao).toFixed(2);
                                let sinal = saldo > 0 ? '+' : '';
                                return '\nSaldo: ' + sinal + saldo + '%'; // Texto alterado aqui
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 12,
                        title: { display: true, text: 'Índice (%)', font: { weight: 'bold' } },
                        ticks: { callback: function(value) { return value + '%'; } }
                    },
                    x: {
                        ticks: {
                            font: function(context) {
                                const textoReal = context.tick && context.tick.label;
                                if (Array.isArray(textoReal) && textoReal[1] === 'GREVE') {
                                    return [{ weight: 'bold' }, { weight: 'bold' }];
                                }
                                return { weight: 'bold' };
                            },
                            color: function(context) {
                                const textoReal = context.tick && context.tick.label;
                                if (Array.isArray(textoReal) && textoReal[1] === 'GREVE') {
                                    return ['#333', '#d9534f'];
                                }
                                return '#333';
                            }
                        }
                    }
                },
                animation: { duration: 1000, easing: 'easeOutQuart' }
            }
        });

        // 5. Lógica de Interatividade Sincronizada
        const btnNominal = document.getElementById('btnNominal');
        const btnReal = document.getElementById('btnReal');
        const btnRanking = document.getElementById('btnRanking');
        const btnSaldo = document.getElementById('btnSaldo');
        const chartTitle = document.getElementById('chartTitle');

        function resetarBotoes() {
            btnNominal.className = '';
            btnReal.className = '';
            btnRanking.className = '';
            btnSaldo.className = '';
        }

        btnNominal.addEventListener('click', () => {
            resetarBotoes();
            btnNominal.classList.add('active-nominal');
            chartTitle.textContent = 'Orçamento TJSP: Valores Nominais (Evolução Cronológica)';
            chartTitle.style.color = '#2c3e50';

            orcamentoChart.data.labels = [...anosCronologicos];
            orcamentoChart.data.datasets[0].data = valoresNominais;
            orcamentoChart.data.datasets[0].backgroundColor = Array(anosCronologicos.length).fill('#8da9c4');
            orcamentoChart.update();

            salarialChart.data.labels = [...labelsSalarialCronologico];
            salarialChart.data.datasets[0].data = inflacaoCronologica;
            salarialChart.data.datasets[1].data = reposicaoCronologica;
            salarialChart.update();
        });

        btnReal.addEventListener('click', () => {
            resetarBotoes();
            btnReal.classList.add('active-real');
            chartTitle.textContent = 'Orçamento TJSP: Valores Reais Corrigidos (Evolução Cronológica)';
            chartTitle.style.color = '#d9534f';

            orcamentoChart.data.labels = [...anosCronologicos];
            orcamentoChart.data.datasets[0].data = valoresReais;
            orcamentoChart.data.datasets[0].backgroundColor = Array(anosCronologicos.length).fill('#d9534f');
            orcamentoChart.update();

            salarialChart.data.labels = [...labelsSalarialCronologico];
            salarialChart.data.datasets[0].data = inflacaoCronologica;
            salarialChart.data.datasets[1].data = reposicaoCronologica;
            salarialChart.update();
        });

        btnRanking.addEventListener('click', () => {
            resetarBotoes();
            btnRanking.classList.add('active-ranking');
            chartTitle.textContent = 'Orçamento TJSP: Ranking de Orçamento (do Maior ao Menor)';
            chartTitle.style.color = '#2c3e50';

            orcamentoChart.data.labels = [...anosRanking];
            orcamentoChart.data.datasets[0].data = valoresRanking;
            orcamentoChart.data.datasets[0].backgroundColor = coresRanking;
            orcamentoChart.update();

            salarialChart.data.labels = [...labelsSalarialRanking];
            salarialChart.data.datasets[0].data = inflacaoRanking;
            salarialChart.data.datasets[1].data = reposicaoRanking;
            salarialChart.update();
        });
        
        // Ação 4: Visão Saldo Salarial
        btnSaldo.addEventListener('click', () => {
            resetarBotoes();
            btnSaldo.classList.add('active-saldo');
            chartTitle.textContent = 'Orçamento Real vs Saldo Salarial (Maior Ganho ao Maior Arrocho)';
            chartTitle.style.color = '#8e44ad';

            orcamentoChart.data.labels = [...anosSaldo];
            orcamentoChart.data.datasets[0].data = valoresReaisSaldo;
            orcamentoChart.data.datasets[0].backgroundColor = Array(anosCronologicos.length).fill('#9b59b6');
            orcamentoChart.update();

            salarialChart.data.labels = [...labelsSalarialSaldo];
            salarialChart.data.datasets[0].data = inflacaoSaldo;
            salarialChart.data.datasets[1].data = reposicaoSaldo;
            salarialChart.update();
        });
    </script>
</body>
</html>
